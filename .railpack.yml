# Railpack configuration for Traced
# Explicitly use Docker builder

builder: docker

# Docker build arguments
build:
  dockerfile: Dockerfile
  context: .

# Deployment configuration
deploy:
  startCommand: "gunicorn -k uvicorn.workers.UvicornWorker traced_wsgi:server --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
  healthcheckPath: /health
  healthcheckTimeout: 5

# Environment variables
env:
  EVIDENCE_HOST: 0.0.0.0
  EVIDENCE_DATA_DIR: /app/data
  EVIDENCE_READ_ONLY: false
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
