[project]
name = "evidence-explorer"
version = "0.1.0"
description = "A local news evidence explorer with Dash, SQLite, a worker, and Ollama."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  # Widen only after the renderer passes the real-launcher browser gate.
  "dash>=3.2,<4.2",
  "dash-cytoscape>=1.0,<2",
  "feedparser>=6.0.11,<7",
  "fpdf2>=2.8,<3",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "trafilatura>=2.0,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
hosting = ["gunicorn>=23,<26; sys_platform != 'win32'"]
swarm = ["swarm-detector>=0.1.0; python_version < '3.13'"]

[tool.uv.sources]
swarm-detector = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
evidence-explorer = "evidence_explorer.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_explorer"]

[tool.hatch.build.targets.sdist]
include = ["/src/evidence_explorer", "/README.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel.force-include]
"src/evidence_explorer/data/sample_articles.json" = "evidence_explorer/data/sample_articles.json"

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint]
extend-select = ["E"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
