[project]
name = "traced-workspace"
version = "0.1.0"
description = "Development workspace for the Traced evidence workbench."
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false
required-version = "==0.11.3"

[tool.uv.workspace]
members = ["evidence-explorer", "swarm-detector", "operation-silent-storm"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv-trail",
    ".venv-demo",
    "artifacts",
    "dataset",
    "dist",
    "build",
    "docs/review-evidence",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
