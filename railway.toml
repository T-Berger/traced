# Railway configuration for Traced Evidence Workbench
# This file tells Railway how to deploy the application

[build]
# Use Dockerfile in root for integrated deployment
builder = "docker"
dockerfile = "Dockerfile"

[deploy]
# Start the integrated workspace
startCommand = "gunicorn -k uvicorn.workers.UvicornWorker traced_wsgi:server --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"

# Health check configuration
healthCheckPath = "/health"
healthCheckTimeout = 5

# Environment variables
[env]
EVIDENCE_HOST = "0.0.0.0"
TRACED_PORT = "$PORT"
EVIDENCE_DATA_DIR = "/app/data"
EVIDENCE_READ_ONLY = "false"
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"

# Resource configuration
[resources]
cpu = 2
memory = "4GB"

# Volume configuration
[[volumes]]
name = "traced-data"
mountPath = "/app/data"
sizeGB = 10
