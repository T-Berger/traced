services:
  app:
    build:
      context: ..
      dockerfile: swarm-detector/Dockerfile
    ports:
      - "127.0.0.1:8050:8050"
    environment:
      PORT: "8050"
      SWARM_DATA_DIR: /var/data
      SWARM_BASIC_AUTH_USER: ${SWARM_BASIC_AUTH_USER:-}
      SWARM_BASIC_AUTH_PASSWORD: ${SWARM_BASIC_AUTH_PASSWORD:-}
    volumes:
      - swarm-data:/var/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  swarm-data:
